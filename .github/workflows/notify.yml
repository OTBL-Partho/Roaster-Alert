name: Daily Monitoring Notification

on:
  # Triggered daily at 4:00 PM Bangladesh time (UTC+6) by an external scheduler (cron-job.org)
  # calling the workflow_dispatch API. GitHub's own schedule ran 6-10 hours late, so it is not used.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install nodemailer@6

      - name: Send Notifications
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: node send-notifications.js
